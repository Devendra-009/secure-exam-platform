services:
  - type: web
    name: secure-exam-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secure-exam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_ISSUER
        value: secure-exam
      - key: JWT_AUDIENCE
        value: secure-exam-client
      - key: CLIENT_URL
        value: https://secure-exam-client.onrender.com
      - key: DB_POOL_MAX
        value: "10"
      - key: TRUST_PROXY
        value: "1"

  - type: web
    runtime: static
    name: secure-exam-client
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://secure-exam-api.onrender.com https://cdn.jsdelivr.net https://storage.googleapis.com wss:;"
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: no-store
    envVars:
      - key: VITE_API_URL
        value: https://secure-exam-api.onrender.com/api

databases:
  - name: secure-exam-db
    plan: starter
